# deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskito-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskito
  template:
    metadata:
      labels:
        app: taskito
    spec:
      containers:
      - name: taskito
        image: taskito:latest
        ports:
        - containerPort: 3000
